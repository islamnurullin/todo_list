<!DOCTYPE html>
<html lang="ru">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нуруллин Ислам Галимуллович</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Список задач</h1>
    
    <div class="new-task">
        <h2>Новая задача</h2>
        <div class="input-container">
            <input type="text" placeholder="Название задачи...">
            <button>Добавить</button>
        </div>
    </div>
    
    <div class="columns">
        <div class="column">
            <h3>Бэклог</h3>
            <ul>
                <li>Выучить JS</li>
                <li>Выучить React</li>
                <li>Сделать домашку</li>
            </ul>
        </div>
        
        <div class="column">
            <h3>В процессе</h3>
            <ul>
                <li>Выпить смузи</li>
                <li>Попить воды</li>
            </ul>
        </div>
        
        <div class="column">
            <h3>Готово</h3>
            <ul>
                <li>Позвонить маме</li>
                <li>Погладить кота</li>
            </ul>
        </div>
        
        <div class="column">
            <h3>Корзина</h3>
            <ul>
                <li>Сходить погулять</li>
                <li>Прочитать Войну и Мир</li>
            </ul>
        </div>
    </div>
</body>

</html>
